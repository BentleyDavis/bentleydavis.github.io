<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
<header>
  <h1>Tasks</h1>
  <span id="save-status" role="status" aria-live="polite"></span>
</header>
<div id="status" role="status">Loading…</div>
<div id="error" role="alert" hidden></div>
<div id="auth">
  <span id="who"></span>
  <form id="signin">
    <button id="googleBtn" type="button">Sign in with Google</button>
    <input id="email" type="email" placeholder="email" aria-label="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="password" aria-label="Password" autocomplete="current-password" required>
    <button id="signinBtn" type="submit">Sign in</button>
  </form>
  <button id="signoutBtn" hidden>Sign out</button>
</div>
<div id="app" hidden></div>
<div id="editor-overlay" hidden>
  <div class="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <button id="editor-close" type="button" aria-label="Close editor">×</button>
    <h2 id="editor-title">Edit task</h2>
    <div id="editor-fields"></div>
  </div>
</div>
<nav id="bottom-menu">
  <button id="mode-toggle" type="button" aria-pressed="false">Drag: off</button>
  <button id="add-task" type="button">+ Add task</button>
</nav>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
